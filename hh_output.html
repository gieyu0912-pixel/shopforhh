<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOW HOW 出貨系統 · 2026-10-10</title>
<style>
  :root {
    --bg: #f7f1ea;
    --paper: #fffcf8;
    --ink: #3d291c;
    --muted: #8a6a52;
    --line: #eadccb;
    --navy: #a35e2e;
    --brand: #a35e2e;
    --brand-deep: #7c4520;
    --gold: #c4894f;
    --ok: #6d8a4e;
    --wait: #a35e2e;
    --shadow: 0 8px 24px rgba(163,94,46,.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header { background: #fffdf9; color: var(--brand-deep); padding: 16px 18px 14px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 72px; height: 72px; object-fit: contain; }
  .brand h1 { color: var(--brand); }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: .12em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .pages {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px;
    background: #fffdf9; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .pages button, .tools button, .tools select, .tools input, .save, .mini {
    font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 8px 12px;
  }
  .pages button { white-space: nowrap; }
  .pages button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  #testBtn { border-color: var(--brand); color: var(--brand-deep); background: #f6eadf; }
  .test-flag { display: inline-block; margin-left: 6px; font-size: 12px; letter-spacing: 0; color: var(--brand); border: 1px solid var(--brand); border-radius: 999px; padding: 1px 7px; }
  .wrap { width: min(880px, 100%); margin: 0 auto; padding: 12px 12px 48px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .kpi, .card, .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
  .kpi { padding: 12px; }
  .kpi span { display: block; color: var(--muted); font-size: 12px; }
  .kpi b { font-size: 22px; }
  .panel { margin-top: 10px; padding: 12px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  input[type="search"], input[type="text"] { border-radius: 12px; min-width: 0; }
  #q { flex: 1 1 180px; }
  .staffbar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
  .staffbar label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .staffbar input { width: 100%; padding: 10px 12px; }
  .card { margin-top: 10px; padding: 14px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .mask { font-size: 20px; font-weight: 680; letter-spacing: .14em; }
  .sub { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .pill { border-radius: 999px; padding: 3px 8px; font-size: 12px; color: #fff; white-space: nowrap; }
  .m-711 { background: #a35e2e; } .m-fm { background: #8a4e28; } .m-home { background: #c4894f; }
  .m-self { background: #7c4520; } .m-other { background: #b08968; }
  .st { background: #f6eadf; color: var(--brand-deep); }
  .st.done { background: #f3eee4; color: #6d8a4e; }
  .dest { margin: 10px 0 4px; font-size: 15px; line-height: 1.45; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .note { color: var(--wait); font-size: 12px; }
  .work { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .checkline { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .save { background: var(--brand); color: #fff; border-color: var(--brand); }
  .time { font-size: 12px; color: var(--brand-deep); }
  .timeline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .step { font-size: 12px; padding: 4px 8px; border-radius: 999px; background: #f3eee6; color: var(--muted); }
  .step.on { background: #f6eadf; color: var(--brand-deep); }
  .empty { text-align: center; color: var(--muted); padding: 28px 8px; }
  footer { padding: 0 16px 24px; color: var(--muted); font-size: 12px; width: min(880px, 100%); margin: 0 auto; }

  #loginMask { position: fixed; inset: 0; background: rgba(61,41,28,.45); display: none; align-items: center; justify-content: center; z-index: 20; padding: 18px; }
  #loginMask.show { display: flex; }
  #loginBox { width: min(380px, 100%); background: #fffdf9; border: 1px solid var(--line); border-radius: 18px; padding: 22px 18px; box-shadow: var(--shadow); }
  #loginLogo { width: 72px; height: 72px; object-fit: contain; display: block; margin: 0 auto 8px; }
  #loginBox h2 { margin: 0; text-align: center; color: var(--brand); letter-spacing: .08em; font-size: 20px; }
  #loginHint, #loginErr { color: var(--muted); font-size: 13px; text-align: center; }
  #loginErr { color: #8d3b32; min-height: 18px; }
  #loginBox label { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  #loginBox input, #loginBox button { font: inherit; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  #loginBox button { margin-top: 14px; width: 100%; background: var(--brand); color: #fff; border-color: var(--brand); }
  .audit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .audit-table th, .audit-table td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  .audit-table th { color: var(--muted); font-size: 12px; }

  @media (max-width: 640px) { .kpis { grid-template-columns: 1fr 1fr; } }
  @media print {
    .pages, .tools, .staffbar, .save, footer { display: none !important; }
    body { background: #fff; } .card, .kpi, .panel { box-shadow: none; }
  }
</style>
</head>

const methodClass = {"7-11":"m-711","全家":"m-fm","宅配":"m-home","自取":"m-self","其他":"m-other"};
const STAGES = [
  {id:"pick", label:"撿貨", staff:"picker", staffLabel:"撿貨員"},
  {id:"pack", label:"出貨", staff:"packer", staffLabel:"出貨員"},
  {id:"send", label:"寄貨", staff:"sender", staffLabel:"寄貨員"},
  {id:"transit", label:"物流運輸", staff:"sender", staffLabel:"寄貨員"}
];
function isPhone3(v){ return /^\d{3}$/.test(v); }
let view = "list";
let onlyOpen = false;
const linesByNo = {};
DATA.lines.forEach(l => { (linesByNo[l.no] ||= []).push(l); });
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ return {}; } }
function saveStore(db){ localStorage.setItem(KEY, JSON.stringify(db)); }
let db = load();
function rec(no){ return db[no] || {picker:"",packer:"",sender:"",pick:null,pack:null,send:null,transit:null,log:[]}; }
function now(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }
function statusOf(no){
  const r = rec(no);
  if (r.transit) return "物流運輸";
  if (r.send) return "寄貨";
  if (r.pack) return "出貨";
  if (r.pick) return "撿貨";
  return "待處理";
}
function filtered(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const method = document.getElementById("method").value;
  const group = document.getElementById("group").value;
  const rows = DATA.ships.filter(s => {
    if (method && s.method !== method) return false;
    if (group && s.group !== group) return false;
    if (onlyOpen && view !== "list" && view !== "track") {
      const map = {pick:"pick", pack:"pack", send:"send"};
      if (rec(s.no)[map[view]]) return false;
    }
    if (!q) return true;
    return [s.no,s.id,s.mask,s.dest,s.code,s.list,s.note].join(" ").toLowerCase().includes(q);
  });
  return rows.sort((a,b) => (a.no===TEST_NO?-1:0) - (b.no===TEST_NO?-1:0));
}
function kpis(list){
  const qty = list.reduce((a,s)=>a+Number(s.qty||0),0);
  const done = DATA.ships.filter(s => rec(s.no).transit).length;
  document.getElementById("kpis").innerHTML = [
    ["出貨單", list.length], ["件數", qty], ["已寄出", DATA.ships.filter(s=>rec(s.no).send).length], ["物流運輸", done]
  ].map(([k,v])=>`<div class="kpi"><span>${k}</span><b>${v}</b></div>`).join("");
}
function pills(s){
  const st = statusOf(s.no);
  return `<div class="pills"><span class="pill ${methodClass[s.method]||'m-other'}">${esc(s.method)}</span><span class="pill st ${st==='待處理'?'':'done'}">${esc(st)}</span></div>`;
}
function items(no){
  return (linesByNo[no]||[]).map(l => `<div class="item"><div>${esc(l.name)}　${esc(l.color)} / ${esc(l.size)}</div><div class="sub">×${esc(l.qty)}　${esc(l.sku)}　${esc(l.note_no)}</div></div>`).join("");
}
function head(s){
  return `<div class="top"><div><div class="mask">${esc(s.mask)}${s.no==="TEST-000"?'<span class="test-flag">測試</span>':''}</div><div class="sub">${esc(s.no)}　${esc(s.group)}　ID ${esc(s.id)}</div></div>${pills(s)}</div>
  <div class="dest">${esc(s.dest)}${s.code?`<div class="sub">店號 ${esc(s.code)}</div>`:""}</div>
  <div class="sub">${esc(s.items)} 項 / ${esc(s.qty)} 件</div>
  ${s.note?`<div class="note">${esc(s.note)}</div>`:""}`;
}
function workBox(s, stage){
  const r = rec(s.no);
  const saved = r[stage.id];
  const staffVal = r[stage.staff] || "";
  return `<div class="work">
    <label class="sub">${stage.staffLabel}・手機末三碼<input class="mini" data-staff="${stage.staff}" data-no="${esc(s.no)}" value="${esc(staffVal)}" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" placeholder="自己的手機末三碼"></label>
    <label class="checkline"><input type="checkbox" data-check="${stage.id}" data-no="${esc(s.no)}" ${saved?"checked":""}> ${stage.label}完成</label>
    <button class="save" data-save="${stage.id}" data-no="${esc(s.no)}">打勾存檔</button>
    <div class="time">${saved?`${stage.label}已存檔　末三碼 ${esc(saved.staff)}　${esc(saved.at)}`:"尚未存檔"}</div>
  </div>`;
}
function card(s, stage){
  return `<article class="card">${head(s)}${items(s.no)}${stage?workBox(s, stage):""}</article>`;
}
function track(s){
  const r = rec(s.no);
  const steps = STAGES.map(st => `<span class="step ${r[st.id]?"on":""}">${st.label}${r[st.id]?" "+esc(r[st.id].at.slice(5,16)):""}</span>`).join("");
  const log = (r.log||[]).slice().reverse().map(x=>`<div class="sub">${esc(x.at)}　${esc(x.label)}　末三碼 ${esc(x.staff)}</div>`).join("");
  return `<article class="card">${head(s)}<div class="timeline">${steps}</div>${log||'<div class="sub">尚無存檔</div>'}</article>`;
}
function render(){
  const list = filtered();
  kpis(list);
  const bar = document.getElementById("staffbar");
  const stage = STAGES.find(s => s.id === view);
  bar.style.display = stage ? "grid" : "none";
  if (stage) bar.innerHTML = `<label>本頁預設${stage.staffLabel}・自己手機末三碼<input id="defaultStaff" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" placeholder="先填末三碼，存檔時帶入空白欄"></label>`;
  const root = document.getElementById("view");
  if (!list.length) { root.innerHTML = `<div class="empty">沒有符合的單</div>`; return; }
  if (view === "audit") {
    if (!root.dataset.auditReady) root.innerHTML = `<div class="empty">讀取稽核紀錄</div>`;
    renderAudit().then(html => { if (view === "audit") { root.innerHTML = html; root.dataset.auditReady = "1"; } });
    return;
  }
  else if (view === "list") root.innerHTML = list.map(s => card(s)).join("");
  else if (view === "track") root.innerHTML = list.map(track).join("");
  else root.innerHTML = list.map(s => card(s, stage)).join("");
  bind();
}
function bind(){
  document.querySelectorAll("[data-staff]").forEach(el => el.addEventListener("input", () => {
    el.value = el.value.replace(/\D/g,"").slice(0,3);
    const r = rec(el.dataset.no); r[el.dataset.staff] = el.value; db[el.dataset.no] = r; saveStore(db);
  }));
  document.querySelectorAll("[data-save]").forEach(btn => btn.addEventListener("click", () => {
    const no = btn.dataset.no;
    const stage = STAGES.find(s => s.id === btn.dataset.save);
    const box = document.querySelector(`[data-check="${stage.id}"][data-no="${no}"]`);
    const staffInput = document.querySelector(`[data-staff="${stage.staff}"][data-no="${no}"]`);
    const fallback = document.getElementById("defaultStaff");
    const staff = ((staffInput.value || (fallback && fallback.value) || "").replace(/\D/g,"")).slice(0,3);
    if (box.checked && !isPhone3(staff)) { alert(`請填自己手機末三碼，三個數字`); return; }
    const r = rec(no);
    r[stage.staff] = staff;
    if (box.checked) {
      const at = now();
      r[stage.id] = {staff, at};
      r.log = r.log || [];
      r.log.push({label: stage.label, staff, at});
    } else {
      r[stage.id] = null;
      r.log = r.log || [];
      r.log.push({label: "取消"+stage.label, staff: staff || "未填", at: now()});
    }
    db[no] = r; saveStore(db);
    audit(box.checked ? stage.label + "存檔" : "取消" + stage.label, {no, staff, detail: (box.checked ? "完成" : "取消") + " " + stage.label});
    render();
  }));
}
document.querySelectorAll(".pages button").forEach(btn => btn.addEventListener("click", () => {

["q","method","group"].forEach(id => document.getElementById(id).addEventListener("input", render));

  document.getElementById("q").value = "測*戶";
  document.getElementById("method").value = "";
  document.getElementById("group").value = "";
  render();
  const msg = next === "reset" ? "測試客戶已重置為待處理" : "測試客戶狀態：" + statusOf(TEST_NO);
  const tip = document.getElementById("testTip");
  if (tip) tip.textContent = msg + "　" + at;
}
document.getElementById("testBtn").addEventListener("click", runTest);
const AUDIT_KEY = "ship-audit-20261010";
const PASS_OPS = "4rfvbgt5hh";
const PASS_AUDIT = "asdfghjkl";
const PAGE_NAME = {list:"商品出貨清單", pick:"撿貨", pack:"出貨", send:"寄貨", track:"客戶貨況狀態", audit:"稽核"};
let session = null;
let pendingView = "list";
function loadAudit(){ try { return JSON.parse(localStorage.getItem(AUDIT_KEY) || "[]"); } catch(e){ return []; } }
function saveAudit(rows){ localStorage.setItem(AUDIT_KEY, JSON.stringify(rows)); }
const SHEET_SECRET = "howhow-sheet-2026";
const DEFAULT_SHEET = "https://script.google.com/macros/s/AKfycbzDwjm5MwcDBOJvCjJHncoiLwsGNPPKprHdZ7Sn16fK7Y9BifB1HckIEZ8YmQgTR0Ux/exec";
function sheetUrl(){ return (localStorage.getItem("howhow-sheet-url") || DEFAULT_SHEET).trim(); }
function setSheetUrl(v){ localStorage.setItem("howhow-sheet-url", (v || "").trim()); }
function pushShared(row){
  const url = sheetUrl();
  if (!url) return;
  const q = url + (url.includes("?") ? "&" : "?") + "action=add&key=" + encodeURIComponent(SHEET_SECRET) + "&payload=" + encodeURIComponent(JSON.stringify(row));
  fetch(q).catch(()=>{});
}
async function loadShared(){
  const url = sheetUrl();
  if (!url) throw new Error("未設定 Google 試算表後台網址");
  const q = url + (url.includes("?") ? "&" : "?") + "action=list&key=" + encodeURIComponent(SHEET_SECRET);
  const res = await fetch(q);
  if (!res.ok) throw new Error("試算表讀取失敗 " + res.status);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || "試算表拒絕");
  return data.rows || [];
}
function deviceInfo(){
  return {
    ua: navigator.userAgent,
    lang: navigator.language,
    screen: screen.width + "x" + screen.height,
    dpr: window.devicePixelRatio || 1,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || ""
  };
}
function audit(action, extra){
  const rows = loadAudit();
  const s = extra && extra.no ? DATA.ships.find(x => x.no === extra.no) : null;
  rows.push({
    at: now(),
    role: session ? session.role : "",
    staff: (extra && extra.staff) || (session && session.staff) || "",
    page: PAGE_NAME[view] || view,
    action,
    no: (extra && extra.no) || "",
    id: s ? s.id : "",
    mask: s ? s.mask : "",
    method: s ? s.method : "",
    dest: s ? s.dest : "",
    status: s ? statusOf(s.no) : "",
    detail: (extra && extra.detail) || "",
    device: deviceInfo()
  });
  const kept = rows.slice(-500);
  saveAudit(kept);
  pushShared(kept[kept.length-1]);
}
function roleFor(v){ return v === "audit" ? "稽核" : "作業"; }
function showLogin(v){
  pendingView = v;
  document.getElementById("loginTitle").textContent = v === "audit" ? "稽核登入" : "作業登入";
  document.getElementById("loginHint").textContent = v === "audit" ? "第六頁稽核，請輸入稽核密碼。" : "第一頁到第五頁，請輸入作業密碼。";
  document.getElementById("loginErr").textContent = "";
  document.getElementById("loginPass").value = "";
  document.getElementById("loginMask").classList.add("show");
  document.getElementById("loginStaff").focus();
}
function enterView(v){
  document.querySelectorAll(".pages button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
  view = v;
  audit("進入頁面", {detail: PAGE_NAME[v]});
  render();
}
function requestView(v){
  const need = roleFor(v);
  if (!session || session.role !== need) { showLogin(v); return; }
  enterView(v);
}
async function renderAudit(){
  let shared = [];
  let sharedErr = "";
  try { shared = await loadShared(); } catch(e){ sharedErr = "共用後台暫時讀不到，先顯示這台手機的紀錄"; }
  const local = loadAudit();
  const seen = new Set();
  const rows = [...shared, ...local].filter(r => {
    const key = [r.at, r.staff, r.action, r.page, r.no].join("|");
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).reverse();
  const banner = `<div class="sub">${sharedErr ? sharedErr : "已讀到 " + shared.length + " 筆稽核紀錄"}</div>`;
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = rows.filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
  if (!list.length) return banner + `<div class="empty">尚無稽核紀錄</div>`;
  return banner + `<table class="audit-table"><thead><tr><th>時間</th><th>身分</th><th>末三碼</th><th>頁面</th><th>動作</th><th>出貨單</th><th>訂購人</th><th>收件人</th><th>方式</th><th>狀態</th><th>相關資料</th></tr></thead><tbody>`
    + list.map(r => `<tr><td>${esc(r.at)}</td><td>${esc(r.role)}</td><td>${esc(r.staff)}</td><td>${esc(r.page)}</td><td>${esc(r.action)}</td><td>${esc(r.no)}</td><td>${esc(r.id)}</td><td>${esc(r.mask)}</td><td>${esc(r.method)}</td><td>${esc(r.status)}</td><td>${esc(r.detail)}<div class="sub">${esc(r.dest)}　${esc(r.device && r.device.screen)}　${esc(r.device && r.device.tz)}</div></td></tr>`).join("")
    + `</tbody></table>`;
}
document.getElementById("loginBox").addEventListener("submit", e => {
  e.preventDefault();
  const staff = document.getElementById("loginStaff").value.replace(/\D/g,"").slice(0,3);
  const pass = document.getElementById("loginPass").value;
  const need = roleFor(pendingView);
  const okPass = need === "稽核" ? PASS_AUDIT : PASS_OPS;
  if (!isPhone3(staff)) { document.getElementById("loginErr").textContent = "請填自己手機末三碼"; return; }
  if (pass !== okPass) { document.getElementById("loginErr").textContent = "密碼不正確"; audit("登入失敗", {staff, detail: need}); return; }
  session = {role: need, staff, at: now()};
  document.getElementById("loginMask").classList.remove("show");
  audit("人員登入", {staff, detail: need + "登入成功"});
  enterView(pendingView);
});
document.getElementById("loginStaff").addEventListener("input", e => { e.target.value = e.target.value.replace(/\D/g,"").slice(0,3); });
document.getElementById("loginLogo").src = document.querySelector(".brand img").src;
setInterval(() => { document.getElementById("clock").textContent = "現在系統時間 " + now() + " · 姓名只留頭尾 · 打勾後按存檔才寫入時間"; }, 1000);
setInterval(() => { if (view === "audit" && session && session.role === "稽核" && document.getElementById("view").dataset.auditReady) render(); }, 60000);
showLogin("list");
</script>
