<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>交貨便取件查詢</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg: #f7f3ee; --card: #fffdf9; --ink: #3a2a22; --muted: #8a7364;
    --line: #eadfD4; --green: #885838; --green-d: #6e452c; --red: #9a4034;
    --amber: #885838; --shadow: 0 10px 30px rgba(136, 88, 56, .1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(1200px 500px at 50% -10%, #fff 0%, var(--bg) 55%);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 48px; }
  header { text-align: center; margin-bottom: 16px; }
  .logo { width: 148px; height: auto; display: block; margin: 0 auto 8px; }
  .brand { letter-spacing: .18em; font-size: 13px; color: #885838; font-weight: 700; }
  h1 { font-size: 26px; margin: 6px 0 4px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 13px; line-height: 1.55; }
  .tabs { display: flex; background: #efeae1; border-radius: 14px; padding: 4px; margin: 16px 0; }
  .tabs button {
    flex: 1; border: 0; background: transparent; border-radius: 11px;
    padding: 10px 8px; font-weight: 700; color: var(--muted); cursor: pointer;
  }
  .tabs button.on { background: white; color: var(--ink); box-shadow: var(--shadow); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px;
  }
  label { display: block; font-size: 13px; font-weight: 700; margin: 12px 0 6px; }
  input, select, textarea {
    width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 12px; font-size: 16px; font-family: inherit;
  }
  textarea { min-height: 72px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.primary, button.ghost, button.scan {
    width: 100%; border: 0; border-radius: 12px; padding: 13px 14px;
    font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 12px;
  }
  button.primary { background: var(--green); color: white; }
  button.scan { background: #885838; color: white; }
  button.scan:disabled, button.primary:disabled { opacity: .55; }
  button.ghost { background: #efeae1; color: var(--ink); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  .result { border-left: 4px solid var(--green); }
  .k { color: var(--muted); font-size: 12px; }
  .v { font-size: 16px; font-weight: 700; margin-top: 2px; word-break: break-all; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; margin-top: 8px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 800; padding: 4px 8px; border-radius: 999px; }
  .ok { background: #f3e7dc; color: var(--green-d); }
  .late { background: #fdecec; color: var(--red); }
  .wait { background: #fff4d6; color: var(--amber); }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; }
  .preview { width: 100%; border-radius: 12px; border: 1px solid var(--line); margin-top: 8px; display: none; }
  .list-item { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
  .list-item b { display: block; }
  .tiny { font-size: 12px; color: var(--muted); }
  .hidden { display: none; }
  .miss { color: var(--red); font-size: 12px; font-weight: 700; margin-top: 4px; }
  .hit { color: #885838; font-size: 12px; font-weight: 700; margin-top: 4px; }
  input.flash { border: 2px solid #885838; background: #f8f0e8; }
  .progress { height: 8px; background: #efeae1; border-radius: 99px; overflow: hidden; margin-top: 10px; display: none; }
  .progress > div { height: 100%; width: 0; background: var(--green); }
  pre.raw { white-space: pre-wrap; font-size: 12px; background: #f7f4ee; border-radius: 10px; padding: 8px; max-height: 140px; overflow: auto; }
</style>
</head>

function fromCodes(list) {
  const blob = list.join("\n");
  let code2 = "";
  try {
    const start = blob.indexOf("{");
    const parsed = JSON.parse(blob.slice(start));
    const row = parsed.Utility && parsed.Utility[0] && parsed.Utility[0].Ordinary && parsed.Utility[0].Ordinary[0];
    if (row && row.code2) code2 = String(row.code2).toUpperCase();
  } catch (e) {}
  if (!code2) code2 = (blob.match(/"code2"\s*:\s*"([A-Z0-9]+)"/i) || ["", ""])[1].toUpperCase();
  const track8 = code2.slice(0, 8);
  const tracking = (blob.match(/756888[A-Z0-9]{8,16}/i) || ["", ""])[0].toUpperCase();
  return { code2, track8, tracking, blob };
}
function pick(text, re) {
  const m = text.match(re);
  return m ? m[1].replace(/\s+/g, "") : "";
}
function cjk(s) { return (s || "").replace(/[^\u4e00-\u9fff*＊]/g, ""); }
function fieldAfter(text, label) {
  const lines = text.split(/\n/).map(s => s.trim()).filter(Boolean);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].replace(/\s/g, "");
    if (!line.includes(label)) continue;
    const same = cjk(line.split(/[:：]/).pop());
    if (same && same.length >= 1 && same.length <= 6 && !/注意|材積|尺寸|限制|公斤/.test(same)) return same;
    const next = cjk(lines[i + 1] || "");
    if (next && next.length >= 1 && next.length <= 6) return next;
  }
  return "";
}
function parseLabel(text) {
  const flat = text.replace(/[　]/g, " ");
  const codes = [...flat.matchAll(/([A-Z]\d{11})/ig)].map(m => m[1].toUpperCase());
  const serviceCode = codes[0] || "";
  const tracking = pick(flat, /(756888[A-Z0-9]{8,16})/i).toUpperCase();
  const orderNo = pick(flat, /(26\d{12})/);
  let store = fieldAfter(flat, "門市");
  let name = fieldAfter(flat, "取件人");
  let sender = fieldAfter(flat, "寄件人");
  if (name.startsWith("寄件")) name = "";
  return { serviceCode, tracking, orderNo, store, name, sender, codes };
}
function mark(id, ok, text) {
  const el = document.getElementById(id);
  const msg = document.getElementById(id + "Msg");
  el.classList.remove("flash");
  void el.offsetWidth;
  if (ok) {
    el.classList.add("flash");
    if (msg) { msg.className = "hit"; msg.textContent = "已寫入：" + text; }
  } else if (msg) {
    msg.className = "miss";
    msg.textContent = "沒讀到，請看單手改";
  }
}
function fill(parsed) {
  const pairs = [
    ["name", parsed.name],
    ["store", parsed.store],
    ["serviceCode", parsed.serviceCode],
    ["tracking", parsed.tracking],
    ["orderNo", parsed.orderNo],
    ["sender", parsed.sender]
  ];
  pairs.forEach(([id, val]) => {
    const el = document.getElementById(id);
    if (val) el.value = val;
    if (id === "name" || id === "store") {
      if (val) mark(id, true, val);
      else if (!el.value.trim()) mark(id, false, "");
      else {
        const msg = document.getElementById(id + "Msg");
        if (msg) { msg.className = "hit"; msg.textContent = "沿用你填的，辨識沒覆寫"; }
      }
    }
  });
  showStore(document.getElementById("store").value);
  return pairs.filter(([, v]) => v).length;
}

function findStore(q){
  const s=(q||"").trim();
  if(!s||typeof STORES==="undefined") return null;
  let hit=STORES.find(r=>r[1]===s);
  if(!hit && s.length>=2){
    const c=STORES.filter(r=>r[1].includes(s)||s.includes(r[1]));
    if(c.length===1) hit=c[0];
  }
  return hit;
}
function showStore(name){
  const hit=findStore(name);
  const box=document.getElementById("storeHit");
  if(!box) return;
  box.textContent=hit?("店號 "+hit[0]+"　"+hit[2]):(name?"清單沒有這間，仍可手填":"");
}
document.getElementById("store").addEventListener("input",()=>showStore(document.getElementById("store").value));
const dl=document.getElementById("storeList");
STORES.forEach(r=>{
  const o=document.createElement("option");
  o.value=r[1];
  o.label=r[2];
  dl.appendChild(o);
});

["name", "store"].forEach(id => {
  document.getElementById(id).addEventListener("input", () => {
    const msg = document.getElementById(id + "Msg");
    if (document.getElementById(id).value.trim()) {
      msg.className = "hit";
      msg.textContent = "已手改";
    }
  });
});
document.getElementById("scanBtn").onclick = async () => {
  const f = document.getElementById("photo").files && document.getElementById("photo").files[0];
  const btn = document.getElementById("scanBtn");
  if (!f) { alert("請先選或拍一張寄貨單"); return; }
  btn.disabled = true;
  try {
    setProgress(2, "先讀 QR，再辨文字…");
    const codes = await readCodes(f);
    const fromQr = fromCodes(codes);
    const parts = await prep(f);
    const worker = await getWorker();
    await worker.setParameters({ tessedit_pageseg_mode: "6" });
    setProgress(78, "辨識門市與取件人…");
    const nameRes = await worker.recognize(parts.name);
    setProgress(88, "辨識整張單…");
    const paperRes = await worker.recognize(parts.paper);
    const text = [fromQr.blob, nameRes.data.text || "", paperRes.data.text || ""].filter(Boolean).join("\n");
    document.getElementById("raw").textContent = text || "(沒讀到文字)";
    const parsed = parseLabel(text);
    if (fromQr.tracking) parsed.tracking = fromQr.tracking;
    if (fromQr.track8) {
      parsed.track8 = fromQr.track8;
      document.getElementById("track8").value = fromQr.track8;
    }
    fill(parsed);
    document.getElementById("bar").style.display = "none";
    document.getElementById("scanMsg").textContent = fromQr.track8
      ? "已讀 code2 前八碼 " + fromQr.track8 + "。請到 7-ELEVEN 貨態查詢貼上。"
      : "沒讀到最大張 QR。請對準上方大條碼再辨識。";
    if (!parsed.store || !parsed.name) document.querySelector("details").open = true;
  } catch (err) {
    document.getElementById("scanMsg").textContent = err.message || "辨識失敗";
    alert(err.message || "辨識失敗");
  } finally {
    btn.disabled = false;
  }
};

  ["phone", "name", "store", "serviceCode", "tracking", "sender", "orderNo", "note", "status"].forEach(id => {

document.getElementById("saveBtn").onclick = () => {
  const phone = tail3(document.getElementById("phone").value);
  const name = maskName(document.getElementById("name").value.trim());
  const serviceCode = document.getElementById("serviceCode").value.trim();
  if (!/^\d{3}$/.test(phone)) { alert("只填手機後三碼"); return; }
  if (name.length < 2) { alert("請填取件人姓名"); return; }
  if (!serviceCode) { alert("請填交貨便服務代碼"); return; }
  const row = {
    id: Date.now().toString(), phone, name,
    store: document.getElementById("store").value.trim(),
    serviceCode, tracking: document.getElementById("tracking").value.trim(),
    sender: document.getElementById("sender").value.trim(),
    orderNo: document.getElementById("orderNo").value.trim(),
    track8: document.getElementById("track8").value.trim().toUpperCase(),
    status: document.getElementById("status").value,
    note: document.getElementById("note").value.trim(),
    carrier: "大智通", createdAt: new Date().toISOString().slice(0, 10)
  };
  const rows = load().filter(r => r.serviceCode !== serviceCode);
  rows.unshift(row);
  saveAll(rows);
  renderAdmin();
  alert("已上傳。客人可用這組手機號與姓名查詢。");
};
document.getElementById("qBtn").onclick = () => {
  const phone = tail3(document.getElementById("qPhone").value);
  const name = document.getElementById("qName").value.trim();
  const out = document.getElementById("qOut");
  if (!/^\d{3}$/.test(phone)) { alert("只填手機後三碼"); return; }
  const hits = load().filter(r => tail3(r.phone) === phone && nameMatch(r.name, name));
  if (!hits.length) {
    out.innerHTML = '<div class="card empty">查無資料。請填後三碼，姓名可輸入單上的遮罩。</div>';
    return;
  }
  out.innerHTML = hits.map(hit => `
    <div class="card result">
      <span class="badge ${badge(hit.status)}">${hit.status}</span>
      <div class="grid">
        <div><div class="k">取件人</div><div class="v">${hit.name}</div></div>
        <div><div class="k">取件門市</div><div class="v">${hit.store || "—"}</div></div>
        <div><div class="k">服務代碼</div><div class="v">${hit.serviceCode}</div></div>
        <div><div class="k">貨況查詢碼</div><div class="v">${hit.track8 || "—"}</div></div>
        <div><div class="k">物流商</div><div class="v">${hit.carrier || "大智通"}</div></div>
        <div><div class="k">物流條碼</div><div class="v">${hit.tracking || "—"}</div></div>
      </div>
      <div style="margin-top:12px"><div class="k">寄貨訂單編號</div><div class="v">${hit.orderNo || "—"}</div></div>
      <div style="margin-top:12px"><div class="k">寄件人</div><div class="v">${hit.sender || "—"}</div></div>
      ${hit.track8 ? `<p class="hint">貨況請到 <a href="https://eservice.7-11.com.tw/e-tracking/search.aspx" target="_blank" rel="noopener">7-ELEVEN 查件</a>，貼上 ${hit.track8}。驗證碼需手打。</p>` : ""}
    </div>`).join("");
};
